<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8ab4ff"/><stop offset="100%" stop-color="#2D7DD2"/></linearGradient><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a6e26b"/><stop offset="100%" stop-color="#2E8B57"/></linearGradient><linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c9a8ff"/><stop offset="100%" stop-color="#8A2BE2"/></linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20223a"/>
      <stop offset="100%" stop-color="#16172a"/>
    </linearGradient>
    <radialGradient id="hole" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#222545"/>
      <stop offset="100%" stop-color="#191a30"/>
    </radialGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="dsm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cardshadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="644" height="344" rx="22" fill="url(#card)" stroke="#2a2e4a" stroke-width="1.5" filter="url(#cardshadow)"/>

  <!-- donut ring -->
  <g>
    <path d="M 201.44 84.14 A 104 104 0 0 1 299.75 180.72" fill="none" stroke="url(#g0)" stroke-width="46" stroke-linecap="round" filter="url(#ds)"/><path d="M 299.94 191.61 A 104 104 0 1 1 148.35 95.56" fill="none" stroke="url(#g1)" stroke-width="46" stroke-linecap="round" filter="url(#ds)"/><path d="M 158.27 91.08 A 104 104 0 0 1 190.56 84.14" fill="none" stroke="url(#g2)" stroke-width="46" stroke-linecap="round" filter="url(#ds)"/>
  </g>

  <!-- center hole + label -->
  <circle cx="196" cy="188" r="75.0" fill="url(#hole)"/>
  <text x="196" y="182" font-size="52" font-weight="700" fill="#e6eaff" text-anchor="middle" dominant-baseline="middle">89</text>
  <text x="196" y="218" font-size="15" fill="#7c84a8" text-anchor="middle" letter-spacing="2">PUBLIC REPOS</text>

  <!-- legend -->
  <text x="392" y="78" font-size="22" font-weight="700" fill="#c0caf5">Repository Authorship</text>
  <g transform="translate(392,116)">
    <rect width="18" height="18" rx="6" fill="url(#g0)" filter="url(#dsm)"/>
    <text x="32" y="9" font-size="19" font-weight="600" fill="#c0caf5" dominant-baseline="middle">AI-Written</text>
    <text x="32" y="32" font-size="14" fill="#7c84a8" dominant-baseline="middle">22 repos &#183; 25%</text>
  </g>
  <g transform="translate(392,172)">
    <rect width="18" height="18" rx="6" fill="url(#g1)" filter="url(#dsm)"/>
    <text x="32" y="9" font-size="19" font-weight="600" fill="#c0caf5" dominant-baseline="middle">Manually-Written</text>
    <text x="32" y="32" font-size="14" fill="#7c84a8" dominant-baseline="middle">61 repos &#183; 68%</text>
  </g>
  <g transform="translate(392,228)">
    <rect width="18" height="18" rx="6" fill="url(#g2)" filter="url(#dsm)"/>
    <text x="32" y="9" font-size="19" font-weight="600" fill="#c0caf5" dominant-baseline="middle">Forks</text>
    <text x="32" y="32" font-size="14" fill="#7c84a8" dominant-baseline="middle">6 repos &#183; 7%</text>
  </g>
</svg>
